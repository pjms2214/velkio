[project]
name = "hmi-parqueadero"
version = "0.1.0"
description = "HMI de escritorio para gestion y visualizacion de ocupacion de un parqueadero (Prototipo 1: maqueta, 8 puestos)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # UI HMI (Qt 6) - multiplataforma. Docs: https://doc.qt.io/qtforpython-6/
    "PySide6>=6.8,<7",
    # Cliente MQTT - API CallbackAPIVersion.VERSION2 (ver docs/02-arquitectura.md ADR-004)
    "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["hmi"]

[tool.ruff.lint]
# E: errores PEP8 | F: pyflakes | I: orden de imports | UP: sintaxis moderna | B: bugs comunes
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
